    name: ai_authority_and_evidence_authority
    lifecycle: committed_now
    authority:
      - governance/AI_AUTHORITY_POLICY.yml
    rationale: establish technical decision authority and factual evidence authority without human technical approval

  - capability_id: GOV-CAP-002
    name: scope_and_capability_memory
    lifecycle: committed_now
    authority:
      - planning/CAPABILITY_MEMORY.yml
      - planning/GOVERNANCE_ADOPTION_PLAN.yml
