  - capability_id: PROD-CAP-003
    name: project_gate_verifier_and_runtime
    lifecycle: deferred_not_deleted
    source_authority: STATUS.md
    rationale: Project Gate verifier and runtime are external future integration work

  - capability_id: PROD-CAP-004
    name: production_readiness
    lifecycle: deferred_not_deleted
    source_authority: STATUS.md
    rationale: production readiness remains false until real execution and completion evidence exist

