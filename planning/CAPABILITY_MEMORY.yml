  - capability_id: GOV-CAP-003
    name: deterministic_governance_enforcement
    lifecycle: deferred_not_deleted
    planned_increment: GOV-003-DETERMINISTIC-GOVERNANCE-ENFORCEMENT
    rationale: schemas validators invalid fixtures and sequence CI belong to the next dependent increment

  - capability_id: GOV-CAP-004
    name: exact_head_independent_review_lifecycle
    lifecycle: deferred_not_deleted
    planned_increment: GOV-004-EXACT-HEAD-REVIEW-LIFECYCLE
    rationale: exact-head review provenance and stale-on-change enforcement require the deterministic carriers from GOV-003

  - capability_id: GOV-CAP-005
    name: post_merge_governance_verification
    lifecycle: deferred_not_deleted
    planned_increment: GOV-004-EXACT-HEAD-REVIEW-LIFECYCLE
