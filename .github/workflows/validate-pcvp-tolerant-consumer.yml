name: Validate PCVP tolerant consumer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "data/ce-builder-transformation-registry.v1.json"
      - "docs/PCVP_TOLERANT_CONSUMER_V1.md"
      - "schemas/builder-context-package.schema.json"
      - "scripts/lib/pcvp-carrier.mjs"
      - "scripts/normalize-ce-builder-executable-package.mjs"
      - "scripts/validate-ce-builder-package-adapter.mjs"
      - "scripts/validate-ce-to-builder-contract-gate.mjs"
      - "scripts/validate-package.mjs"
      - "tests/pcvp-tolerant-consumer.test.mjs"
      - ".github/workflows/validate-pcvp-tolerant-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate pinned tolerant PCVP boundary
        run: node tests/pcvp-tolerant-consumer.test.mjs
      - name: Recheck CE contract gate
        run: node scripts/validate-ce-to-builder-contract-gate.mjs
      - name: Recheck transformation registry
        run: node scripts/validate-ce-builder-transformation-registry.mjs
      - name: Recheck CE to Builder adapter
        run: node scripts/validate-ce-builder-package-adapter.mjs
