name: Verify Governance Exact-Head Evidence

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  verify_external_evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          echo "actual_sha=$actual_sha"
          echo "expected_sha=$expected_sha"
          test "$actual_sha" = "$expected_sha"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Collect upstream workflow and Project Gate authority evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          evidence_file="$RUNNER_TEMP/governance-progress-evidence.json"
          python - "$evidence_file" <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          output_path = sys.argv[1]
          repository = os.environ['EXPECTED_REPOSITORY']
          pull_request = int(os.environ['EXPECTED_PR'])
          head_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['GH_TOKEN']
          upstream_required = ['Schema validation', 'Verify Project Gate Contract Pin']
          api_root = f'https://api.github.com/repos/{repository}'
          lock = json.loads(Path('governance/external-authorities/project-gate-authority.v1.json').read_text(encoding='utf-8'))

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ev4-governance-exact-head-evidence'
                  },
                  method='GET'
              )
              opener = urllib.request.build_opener(urllib.request.HTTPHandler())
              with opener.open(request, timeout=30) as response:
                  if response.geturl() != url:
                      raise SystemExit(f'GitHub API redirect forbidden: {url} -> {response.geturl()}')
                  return json.load(response)

          pr = request_json(f'{api_root}/pulls/{pull_request}')
          if pr['base']['repo']['full_name'] != repository:
              raise SystemExit('pull request repository mismatch')
          if pr['number'] != pull_request:
              raise SystemExit('pull request number mismatch')
          if pr['head']['sha'] != head_sha:
              raise SystemExit('pull request head changed or is stale')

          selected = None
          for _ in range(60):
              runs = request_json(f'{api_root}/actions/runs?head_sha={head_sha}&event=pull_request&per_page=100')['workflow_runs']
              by_name = {}
              for name in upstream_required:
                  candidates = []
                  for run in runs:
                      if run.get('name') != name or run.get('head_sha') != head_sha:
                          continue
                      linked_prs = run.get('pull_requests') or []
                      if not any(item.get('number') == pull_request for item in linked_prs):
                          continue
                      candidates.append(run)
                  if candidates:
                      candidates.sort(key=lambda item: item.get('run_number', 0), reverse=True)
                      by_name[name] = candidates[0]
              if len(by_name) == len(upstream_required) and all(run.get('status') == 'completed' for run in by_name.values()):
                  selected = by_name
                  break
              time.sleep(10)
          if selected is None:
              raise SystemExit('upstream exact-head workflow runs did not complete')

          upstream_checks = []
          for name in upstream_required:
              run = selected[name]
              if run.get('conclusion') != 'success':
                  raise SystemExit(f'{name} did not succeed: {run.get("conclusion")}')
              upstream_checks.append({
                  'workflow_name': name,
                  'repository': repository,
                  'pull_request': pull_request,
                  'head_sha': head_sha,
                  'run_id': run['id'],
                  'run_api_url': run['url'],
                  'html_url': run['html_url'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion']
              })

          external_repo = lock['repository']
          external_commit = lock['commit_sha']
          external_repo_api = f'https://api.github.com/repos/{external_repo}'
          repository_payload = request_json(external_repo_api)
          commit_payload = request_json(lock['commit_api_url'])
          if repository_payload['full_name'] != external_repo or repository_payload['id'] != lock['repository_id']:
              raise SystemExit('Project Gate repository identity mismatch')
          if repository_payload['url'] != external_repo_api:
              raise SystemExit('Project Gate repository API URL mismatch')
          if commit_payload['sha'] != external_commit or commit_payload['url'] != lock['commit_api_url'] or commit_payload['html_url'] != lock['commit_html_url']:
              raise SystemExit('Project Gate commit identity mismatch')

          verified_files = []
          for expected_file in lock['files']:
              encoded_path = urllib.parse.quote(expected_file['path'], safe='/')
              contents_url = f'{external_repo_api}/contents/{encoded_path}?ref={external_commit}'
              payload = request_json(contents_url)
              if payload.get('type') != 'file' or payload.get('path') != expected_file['path']:
                  raise SystemExit(f'Project Gate file identity mismatch: {expected_file["path"]}')
              if payload.get('sha') != expected_file['blob_sha'] or payload.get('encoding') != 'base64':
                  raise SystemExit(f'Project Gate blob mismatch: {expected_file["path"]}')
              raw = base64.b64decode(''.join(payload['content'].split()), validate=True)
              git_blob_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()
              if git_blob_sha != expected_file['blob_sha']:
                  raise SystemExit(f'Project Gate Git blob digest mismatch: {expected_file["path"]}')
              text = raw.decode('utf-8')
              for required_substring in expected_file['required_utf8_substrings']:
                  if required_substring not in text:
                      raise SystemExit(f'Project Gate semantic content mismatch: {expected_file["path"]}: {required_substring}')
              verified_files.append({
                  'path': expected_file['path'],
                  'blob_sha': payload['sha'],
                  'git_blob_sha': git_blob_sha,
                  'content_sha256': hashlib.sha256(raw).hexdigest(),
                  'contents_api_url': contents_url,
                  'semantic_substrings_verified': True
              })

          evidence = {
              'schema_version': 2,
              'source': 'github_actions_api',
              'repository': repository,
              'pull_request': pull_request,
              'head_sha': head_sha,
              'pull_request_api_url': pr['url'],
              'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'upstream_checks': upstream_checks,
              'external_authorities': {
                  'project_gate': {
                      'repository': repository_payload['full_name'],
                      'repository_id': repository_payload['id'],
                      'repository_api_url': repository_payload['url'],
                      'commit_sha': commit_payload['sha'],
                      'commit_api_url': commit_payload['url'],
                      'commit_html_url': commit_payload['html_url'],
                      'files': verified_files
                  }
              }
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
          echo "GOVERNANCE_PROGRESS_EVIDENCE=$evidence_file" >> "$GITHUB_ENV"
          sha256sum "$evidence_file"

      - name: Validate external exact-head and Project Gate authority evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-governance-progress-evidence.mjs \
            --mode=live \
            --evidence-file "$GOVERNANCE_PROGRESS_EVIDENCE" \
            --expected-repository "${{ github.repository }}" \
            --expected-pr "${{ github.event.pull_request.number }}" \
            --expected-head "${{ github.event.pull_request.head.sha }}"
