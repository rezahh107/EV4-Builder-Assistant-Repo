name: Verify Governance Exact-Head Evidence

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  verify_external_evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          echo "actual_sha=$actual_sha"
          echo "expected_sha=$expected_sha"
          test "$actual_sha" = "$expected_sha"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Collect external exact-head workflow evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          evidence_file="$RUNNER_TEMP/governance-progress-evidence.json"
          python - "$evidence_file" <<'PY'
          import datetime
          import json
          import os
          import sys
          import time
          import urllib.request

          output_path = sys.argv[1]
          repository = os.environ['EXPECTED_REPOSITORY']
          pull_request = int(os.environ['EXPECTED_PR'])
          head_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['GH_TOKEN']
          required = ['Schema validation', 'Verify Project Gate Contract Pin']
          api_root = f'https://api.github.com/repos/{repository}'

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ev4-governance-exact-head-evidence'
                  },
                  method='GET'
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pr_url = f'{api_root}/pulls/{pull_request}'
          pr = request_json(pr_url)
          if pr['base']['repo']['full_name'] != repository:
              raise SystemExit('pull request repository mismatch')
          if pr['number'] != pull_request:
              raise SystemExit('pull request number mismatch')
          if pr['head']['sha'] != head_sha:
              raise SystemExit('pull request head changed or is stale')

          selected = None
          for _ in range(60):
              runs = request_json(
                  f'{api_root}/actions/runs?head_sha={head_sha}&event=pull_request&per_page=100'
              )['workflow_runs']
              by_name = {}
              for name in required:
                  candidates = []
                  for run in runs:
                      if run.get('name') != name or run.get('head_sha') != head_sha:
                          continue
                      linked_prs = run.get('pull_requests') or []
                      if not any(item.get('number') == pull_request for item in linked_prs):
                          continue
                      candidates.append(run)
                  if candidates:
                      candidates.sort(key=lambda item: item.get('run_number', 0), reverse=True)
                      by_name[name] = candidates[0]
              if len(by_name) == len(required) and all(
                  run.get('status') == 'completed' for run in by_name.values()
              ):
                  selected = by_name
                  break
              time.sleep(10)

          if selected is None:
              raise SystemExit('required exact-head workflow runs did not complete')

          checks = []
          for name in required:
              run = selected[name]
              if run.get('conclusion') != 'success':
                  raise SystemExit(f'{name} did not succeed: {run.get("conclusion")}')
              checks.append({
                  'workflow_name': name,
                  'repository': repository,
                  'pull_request': pull_request,
                  'head_sha': head_sha,
                  'run_id': run['id'],
                  'run_api_url': run['url'],
                  'html_url': run['html_url'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion']
              })

          evidence = {
              'schema_version': 1,
              'source': 'github_actions_api',
              'repository': repository,
              'pull_request': pull_request,
              'head_sha': head_sha,
              'pull_request_api_url': pr['url'],
              'observed_at': datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'required_checks': checks
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          print(json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
          echo "GOVERNANCE_PROGRESS_EVIDENCE=$evidence_file" >> "$GITHUB_ENV"
          sha256sum "$evidence_file"

      - name: Validate external exact-head workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-governance-progress-evidence.mjs \
            --mode=live \
            --evidence-file "$GOVERNANCE_PROGRESS_EVIDENCE" \
            --expected-repository "${{ github.repository }}" \
            --expected-pr "${{ github.event.pull_request.number }}" \
            --expected-head "${{ github.event.pull_request.head.sha }}"
