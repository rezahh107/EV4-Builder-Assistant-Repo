name: Schema validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Deep regression compatibility markers. These commands are executed by
    # npm run validate through scripts/validate.mjs; they are not separate
    # Exact-Head, independent-review, or runtime-authorization steps.
    # Run Builder runtime transaction enforcement validation
    # node scripts/validate-builder-runtime-transaction.mjs tests/valid/runtime-transaction/complete-transaction.json --self-test
    # node scripts/validate-builder-runtime-transaction-state.mjs tests/valid/runtime-transaction/complete-transaction.json

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Report and verify tested object
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "tested_object_type=pull_request_head"
          else
            echo "tested_object_type=push_commit"
          fi
          echo "tested_sha=$ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose auxiliary successor conflict
        id: aux_debug
        run: node scripts/debug-successor-aux-conflict.mjs

      - name: Auxiliary diagnostic injected=${{ steps.aux_debug.outputs.injected_passed }} stage=${{ steps.aux_debug.outputs.injected_stage }} dirs=${{ steps.aux_debug.outputs.transition_count }} result=${{ steps.aux_debug.outputs.result_exists }} retry=${{ steps.aux_debug.outputs.retry_passed }} codes=${{ steps.aux_debug.outputs.retry_codes }} expected=${{ steps.aux_debug.outputs.retry_expected_code }} modified=${{ steps.aux_debug.outputs.retry_state_modified }} generation=${{ steps.aux_debug.outputs.active_generation }}
        run: exit 1

      - name: Run focused successor reconciliation
        run: node scripts/test-builder-successor-reconciliation.mjs

      - name: Run functional validation
        id: functional_validation
        continue-on-error: true
        run: npm run validate

      - name: Functional validation failed at ${{ steps.functional_validation.outputs.failed_check }}
        if: steps.functional_validation.outcome == 'failure'
        run: exit 1
