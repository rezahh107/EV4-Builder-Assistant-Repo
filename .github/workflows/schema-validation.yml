name: Schema validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          echo "actual_sha=$actual_sha"
          echo "expected_sha=$expected_sha"
          test "$actual_sha" = "$expected_sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run central contract validation
        id: central
        continue-on-error: true
        run: |
          npm run validate

      - name: Run governance authority validation
        id: governance_authorities
        if: always()
        continue-on-error: true
        run: |
          node scripts/validate-governance-authorities.mjs

      - name: Run governance fixture regression validation
        id: governance_fixtures
        if: always()
        continue-on-error: true
        run: |
          node scripts/validate-governance-sequence.mjs --mode=fixtures

      - name: Run synthetic valid live receipt regression
        id: live_valid
        if: always()
        continue-on-error: true
        run: |
          node scripts/validate-governance-sequence.mjs --mode=live --evidence-file tests/governance/valid/live_receipt_evidence.json

      - name: Run invalid live receipt regressions
        id: live_invalid
        if: always()
        continue-on-error: true
        run: |
          node scripts/validate-governance-sequence.mjs --mode=live --evidence-file tests/governance/invalid/live_receipt_evidence.json

      - name: Run Builder decision lineage sequence validation
        id: builder_lineage
        if: always()
        continue-on-error: true
        run: |
          npm run validate:builder-lineage-sequence

      - name: Assert all required validation steps succeeded
        if: always()
        shell: bash
        env:
          CENTRAL: ${{ steps.central.outcome }}
          AUTHORITIES: ${{ steps.governance_authorities.outcome }}
          FIXTURES: ${{ steps.governance_fixtures.outcome }}
          LIVE_VALID: ${{ steps.live_valid.outcome }}
          LIVE_INVALID: ${{ steps.live_invalid.outcome }}
          BUILDER_LINEAGE: ${{ steps.builder_lineage.outcome }}
        run: |
          printf '%s\n' \
            "central=$CENTRAL" \
            "governance_authorities=$AUTHORITIES" \
            "governance_fixtures=$FIXTURES" \
            "live_valid=$LIVE_VALID" \
            "live_invalid=$LIVE_INVALID" \
            "builder_lineage=$BUILDER_LINEAGE"
          test "$CENTRAL" = success
          test "$AUTHORITIES" = success
          test "$FIXTURES" = success
          test "$LIVE_VALID" = success
          test "$LIVE_INVALID" = success
          test "$BUILDER_LINEAGE" = success
